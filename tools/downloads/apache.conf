# Include inside MatrixSwarm's VirtualHost blocks only; enable mod_headers.
# Alias avoids inheriting the public document root's blanket ZIP prohibition.
Alias /downloads/ /sites/matrixswarm/shared/downloads/
<Directory /sites/matrixswarm/shared/downloads>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all denied
    <FilesMatch "^(latest\.json|matrixswarm-[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{40}\.(zip(\.sha(256|512))?|json))$">
        Require all granted
    </FilesMatch>
    <Files "latest.json">
        Header always set Cache-Control "no-store"
    </Files>
    <FilesMatch "^matrixswarm-.*\.(zip|sha256|sha512|json)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>
<LocationMatch "^/download/?$">
    <If "%{HTTP_HOST} == 'matrixswarm.com' || %{HTTP_HOST} == 'www.matrixswarm.com'">
        Header always set Cache-Control "no-store"
    </If>
</LocationMatch>
