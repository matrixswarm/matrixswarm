[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-terminal"
version = "0.2.0"
description = "Terminal-first, safety-gated companion for Phoenix Cockpit"
requires-python = ">=3.10"
authors = [{name = "MatrixSwarm operators"}]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
phoenixctl = "phoenix_terminal.cli:main"
phoenix-mcp = "phoenix_terminal.mcp_server:main"

[tool.setuptools.packages.find]
include = ["phoenix_terminal*"]
