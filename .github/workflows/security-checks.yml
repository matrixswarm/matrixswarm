name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/public-release-security-*"

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install security-test dependencies
        run: python -m pip install cryptography==45.0.4 psutil==7.0.0 pycryptodome==3.23.0 requests==2.32.4 websocket-client==1.8.0 -e "./phoenix_terminal[mcp]"

      - name: Compile Python sources
        run: python -m compileall -q matrixos phoenix phoenix_terminal

      - name: Run public-release security invariants
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Phoenix Terminal bridge and MCP tests
        working-directory: phoenix_terminal
        run: python -m unittest discover -s tests -p "test_*.py" -v
