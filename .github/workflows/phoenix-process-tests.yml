name: Phoenix offline process tests (partial coverage)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fresh-vault:
    name: Fresh vault and test harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated lab dependencies
        run: python -m pip install -r phoenix_test_terminal/requirements.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libopengl0 libxcb-cursor0
      - name: Verify offscreen Qt runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PyQt6.QtWidgets import QApplication; app = QApplication([]); print('Offscreen Qt runtime ready')"
      - name: Verify harness fail-closed behavior
        run: python -B -m unittest discover -s phoenix_test_terminal/tests -v
      - name: Exercise actual fresh-vault dialogs across process restarts
        run: python -B -m phoenix_test_terminal run vault --report fresh-vault-report.json
      - name: Exercise guarded startup processes
        run: python -B -m phoenix_test_terminal run startup --report startup-report.json
      - name: Exercise full source cockpit with a fresh profile
        run: python -B -m phoenix_test_terminal run cold-start --report cold-start-report.json
      - name: Exercise registry persistence and rejected transactions
        run: python -B -m phoenix_test_terminal run registry-lifecycle --report registry-report.json
      - name: Exercise workspace graph persistence and rejected transactions
        run: python -B -m phoenix_test_terminal run workspace-lifecycle --report workspace-report.json
      - name: Verify workspace store rollback
        run: python -B -m unittest discover -s tests -p "test_workspace*.py" -v
      - name: Exercise background graph saves and disk failures
        run: python -B -m phoenix_test_terminal run graph-save --report graph-save-report.json
      - name: Exercise editor validation and Qt callback boundaries
        run: python -B -m phoenix_test_terminal run editor-validation --report editor-validation-report.json
      - name: Verify password rotation guards and dialog failure paths
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -B -m unittest discover -s tests -p "test_vault_rotation_guard.py" -v
      - name: Exercise offline Railgun progress and worker lifecycle
        run: python -B -m phoenix_test_terminal run railgun --report railgun-report.json
      - name: Verify deployment including POSIX rendering and Linux memory protection
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        # These trusted tests launch a local shell and protected Python child.
        # Run on the disposable CI runner, outside the lab's no-subprocess guard.
        run: python -B -m unittest discover -s tests -p "test_remote_ssh_launch.py" -v
      - name: Print reports, including explicit parity gaps
        if: always()
        shell: python
        run: |
          from pathlib import Path
          for name in ("fresh-vault-report.json", "startup-report.json", "cold-start-report.json", "registry-report.json", "workspace-report.json", "graph-save-report.json", "editor-validation-report.json", "railgun-report.json"):
              path = Path(name)
              if path.is_file():
                  print(path.read_text(encoding="utf-8"))
